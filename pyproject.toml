[project]
name = "airi"
version = "0.1.0"
description = "Bot de Discord con LLM local (Airi) — arquitectura hexagonal"
requires-python = ">=3.11"
[project.scripts]
airi = "airi.__main__:main"
airi-trace = "airi.observability.cli:main"
airi-replay = "airi.observability.replay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" habilita el paquete airi (src/ layout).
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
